name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run build
      - name: Check the Windows setup script in Windows PowerShell 5.1
        if: runner.os == 'Windows' && matrix.node == 22
        shell: powershell
        run: |
          $errs = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile("$pwd\gateway\windows\setup.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          # Load the helper functions, build the key window without showing it, and check key cleaning.
          $fns = $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)
          foreach ($f in $fns) { Invoke-Expression ($f.Extent.Text -replace '\$form\.ShowDialog\(\)', '[System.Windows.Forms.DialogResult]::Cancel') }
          if ($null -ne (AskKeyDialog "Developer Key" "test")) { throw "key window should return nothing when cancelled" }
          if ((Clean-Key (" `"abc123XYZ`"`r`n" + [char]0x200B)) -ne "abc123XYZ") { throw "Clean-Key failed" }
          if ((Describe-Key "Key: ab/c") -notmatch "label") { throw "Describe-Key failed" }
          "setup.ps1 OK"
      - name: Attach installable files to this run
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: opendental-install-files
          path: |
            dist/opendental.mcpb
            dist/opendental.plugin
            dist/opendental-gateway-windows-*.zip
