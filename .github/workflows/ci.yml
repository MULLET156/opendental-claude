name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run build
      - name: Check the Windows setup script in Windows PowerShell 5.1
        if: runner.os == 'Windows' && matrix.node == 22
        shell: powershell
        run: |
          $errs = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile("$pwd\gateway\windows\setup.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          # Load the helper functions, build the key window without showing it, and check key cleaning.
          $fns = $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)
          foreach ($f in $fns) { Invoke-Expression ($f.Extent.Text -replace '\$form\.ShowDialog\(\)', '[System.Windows.Forms.DialogResult]::Cancel') }
          if ($null -ne (AskKeyDialog "Developer Key" "test")) { throw "key window should return nothing when cancelled" }
          if ((Clean-Key (" `"abc123XYZ`"`r`n" + [char]0x200B)) -ne "abc123XYZ") { throw "Clean-Key failed" }
          if ((Describe-Key "Key: ab/c") -notmatch "label") { throw "Describe-Key failed" }
          "setup.ps1 OK"
      - name: Attach installable files to this run
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: opendental-install-files
          path: |
            dist/opendental.mcpb
            dist/opendental.plugin
            dist/opendental-gateway-windows-*.zip
  docker:
    # The TrueNAS/Docker image builds, starts with a design-stage config, and answers /health.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t odgw-test .
      - name: Start it with a fresh config and check /health
        run: |
          mkdir -p cfg && sudo chown 1000:1000 cfg
          docker run --rm -v "$PWD/cfg:/config" odgw-test node gateway/cli.js init /config --stage design
          # Placeholder Open Dental settings (never contacted; /health doesn't call Open Dental).
          printf 'OD_BASE_URL=http://127.0.0.1:9/api/v1\nOD_DEVELOPER_KEY=ciDeveloperKey\nOD_CUSTOMER_KEY=ciCustomerKey\n' | sudo tee cfg/.env >/dev/null
          sudo chown 1000:1000 cfg/.env
          docker run -d --name odgw --network host -e AUTO_UPDATE=off -v "$PWD/cfg:/config" odgw-test
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/health | grep -q '"stage":"design"'
          docker logs odgw
          docker rm -f odgw
