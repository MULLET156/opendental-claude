name: Release
# Builds dist/opendental.mcpb, dist/opendental.plugin, the Windows gateway zip, the Linux gateway
# tar.gz and SHA256SUMS, and publishes them on GitHub. Regular releases also publish the gateway
# image ghcr.io/mullet156/opendental-claude (:<version> and :latest).
#   From main (or a v* tag): a release named after the version in package.json.
#   From any other branch, or with "test build" ticked: a pre-release named
#   v<version>-test.<run number>, so a pull request can be tried before it's merged.
#   Pre-releases never become the "latest" release.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.3.0.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test build (pre-release)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Work out the tag
        id: tag
        env:
          TEST_INPUT: ${{ inputs.test }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$TAG" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ($TAG)"; exit 1
          fi
          TEST=false
          if [ "$TEST_INPUT" = "true" ]; then TEST=true; fi
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then TEST=true; fi
          if [ "$TEST" = "true" ]; then TAG="v$VERSION-test.${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TEST: ${{ steps.tag.outputs.test }}
        run: |
          FILES="dist/opendental.mcpb dist/opendental.plugin $(ls dist/opendental-gateway-windows-*.zip) $(ls dist/opendental-gateway-*.tar.gz) dist/SHA256SUMS"
          if [ "$TEST" = "true" ]; then
            printf 'Test build from branch `%s` (commit %s), for trying changes before they are merged. Not a regular release.\n\nSee CHANGELOG.md on that branch for what changed.\n' "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}" > notes.md
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "$TAG (test build)" --notes-file notes.md --prerelease --latest=false
          elif gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "$TAG" --notes-file CHANGELOG.md
          fi
      - name: Publish the gateway image (regular releases only)
        if: steps.tag.outputs.test != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          IMAGE=ghcr.io/mullet156/opendental-claude
          VERSION="${TAG#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
