# TrueNAS SCALE: Apps -> Discover Apps -> (⋮) Install via YAML, paste this, then:
#   - change the folder on the "volumes" line to the dataset you made for the gateway;
#   - paste your Cloudflare tunnel token after TUNNEL_TOKEN (step 4 of docs/truenas.md).
# The token stays in TrueNAS. Never put it in GitHub, email or chat.
services:
  opendental-gateway:
    image: ghcr.io/mullet156/opendental-claude:latest
    restart: unless-stopped
    # Host network: the gateway listens on 127.0.0.1:8787 of the NAS, where only the
    # Cloudflare tunnel (also on the host network) reaches it. Nothing else on the office
    # network can.
    network_mode: host
    user: "568:568" # TrueNAS's "apps" user; it must own the dataset below
    environment:
      TZ: America/Los_Angeles
      AUTO_UPDATE: "on" # "off" stays on the version in the image
      UPDATE_HOUR: "3" # checks GitHub for a new release at 3 am
    volumes:
      - /mnt/POOL/apps/opendental-gateway:/config

  cloudflared:
    # Cloudflare's tunnel app. It connects out to Cloudflare, so nothing opens on the router.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "paste-your-tunnel-token-here"
